[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -c /app/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nextjs]
command=node /app/setlist-helper/.next/standalone/server.js
directory=/app/setlist-helper/.next/standalone
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="0.0.0.0"
priority=20

[program:setloader]
command=/opt/setloader-venv/bin/uvicorn server_simple_db:app --host 127.0.0.1 --port 8002
directory=/app/setloader
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:flyer-forge]
command=/bin/sh -c 'exec node server.js'
directory=/app/flyer-forge/.next/standalone
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3010",HOSTNAME="0.0.0.0",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1",AUTH_PROVIDER="google",NEXT_PUBLIC_BASE_PATH="/flyer-forge",SETLOADER_INTERNAL_URL="http://127.0.0.1:8002",LOCAL_PGLITE_DIR="/data/pglite-flyer-forge",SECRET="%(ENV_SECRET)s",APP_URL="%(ENV_APP_URL)s",GOOGLE_CLIENT_ID="%(ENV_GOOGLE_CLIENT_ID)s",GOOGLE_CLIENT_SECRET="%(ENV_GOOGLE_CLIENT_SECRET)s",AUTH_SECRET="%(ENV_AUTH_SECRET)s",ALLOWED_EMAILS="%(ENV_ALLOWED_EMAILS)s"
priority=40

[program:show-recap]
command=/opt/show-recap-venv/bin/uvicorn server:app --host 127.0.0.1 --port 8003
directory=/app/show-recap
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SHOW_RECAP_DATA_DIR="/data/show-recap"
priority=50
