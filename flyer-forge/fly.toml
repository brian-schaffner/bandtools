# Deploy with: fly deploy --app <your-app-name>
# Required secrets (fly secrets set ...): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, AUTH_SECRET, ALLOWED_EMAILS
# Optional: ANTHROPIC_API_KEY, ANTHROPIC_MODEL. Set APP_URL below to the app's public https URL.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AUTH_PROVIDER = "google"
  LOCAL_PGLITE_DIR = "/data/pglite"
  PORT = "8080"

[mounts]
  source = "gfs_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/signin"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
