worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    absolute_redirect off;
    port_in_redirect off;

    upstream nextjs {
        server 127.0.0.1:3000;
    }

    upstream setloader_api {
        server 127.0.0.1:8002;
    }

    upstream flyers_api {
        server 127.0.0.1:8080;
    }

    upstream flyer_forge {
        server 127.0.0.1:3100;
    }

    upstream show_recap_api {
        server 127.0.0.1:8003;
    }

    server {
        listen 8090;
        server_name _;

        location = /health {
            proxy_pass http://setloader_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Flyer Forge (Next.js, basePath /forge) — replaces the Gig Flyers / Flyer Agent pages
        location /forge {
            proxy_pass http://flyer_forge;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Retired Gig Flyers / Flyer Agent pages → Flyer Forge
        location = /flyers {
            return 302 /forge/;
        }

        location = /flyers/health {
            proxy_pass http://flyers_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /flyers/ {
            return 302 /forge/;
        }

        # Still served by the bridge: day schedule (+ drive check, email) and previously generated flyer images
        location ~ ^/flyers/(logistics|output/)(.*)$ {
            proxy_pass http://flyers_api/$1$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Session-ID $http_x_session_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_redirect off;
        }

        # Show Recap API — /api/show-recap/* → show-recap service on 8003
        location /api/show-recap/ {
            proxy_pass http://show_recap_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 10G;
        }

        # Setloader API — strip /api prefix (matches Caddy/Tailscale local config)
        location /api/ {
            proxy_pass http://setloader_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /_next/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1d;
        }

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
