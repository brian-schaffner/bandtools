name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: false
        default: main
      skip_secrets:
        description: Skip secret sync (use existing Fly secrets)
        type: boolean
        default: true
      run_wild_d_experiment:
        description: After deploy, run live H1/H2 wild D band photo experiment
        type: boolean
        default: false
  push:
    branches:
      - main
      - cursor/flyer-agent-v2-980b
      - cursor/flyer-agent-980b
      - cursor/setlist-key-offset-fix-c597
      - cursor/show-recap-feature-c597
      - cursor/fix-gzip-datafile-loading-b8d2

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Preflight Fly auth
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_IO_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
          fly.io token: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # shellcheck source=scripts/deploy/lib.sh
          source scripts/deploy/lib.sh
          resolve_fly_api_token
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "ERROR: Fly token not found. Set GitHub secret FLY_API_TOKEN (or Cursor secret fly.io token)." >&2
            exit 1
          fi
          flyctl version
          flyctl auth whoami

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run wild Gemini import regression tests
        run: |
          pip install -r gig-flyers/requirements.txt
          cd gig-flyers && python -m unittest \
            tests.test_wild_gemini_integration \
            tests.test_wild_color_correct \
            tests.test_assurance_profile \
            tests.test_logistics_backtest \
            tests.test_logistics_units \
            tests.test_logistics_web \
            tests.test_calendar_cache \
            tests.test_facebook_calendar \
            -v

      - name: Sync logistics secrets to staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_IO_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.MAPS_API_KEY }}
          BAND_HOME_ADDRESS: ${{ secrets.BAND_HOME_ADDRESS || secrets.BAND_ADDRESS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LOGISTICS_EMAIL_TO: ${{ secrets.LOGISTICS_EMAIL_TO }}
        run: |
          source scripts/deploy/lib.sh
          resolve_fly_api_token
          ./scripts/deploy/sync-logistics-secrets.sh bandtools-test

      - name: Sync Flyer Forge secrets (Facebook, Claude) to staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_IO_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          source scripts/deploy/lib.sh
          resolve_fly_api_token
          ./scripts/deploy/stage-ci-secrets.sh bandtools-test FACEBOOK_PAGE_ID FACEBOOK_PAGE_ACCESS_TOKEN ANTHROPIC_API_KEY ANTHROPIC_MODEL

      - name: Deploy to staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_IO_TOKEN: ${{ secrets.FLY_IO_TOKEN }}
          fly.io token: ${{ secrets.FLY_API_TOKEN }}
        run: |
          source scripts/deploy/lib.sh
          resolve_fly_api_token
          ARGS=(--no-smoke)
          if [[ "${{ github.event.inputs.skip_secrets }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            ARGS+=(--skip-secrets)
          fi
          ./scripts/deploy-staging.sh "${ARGS[@]}"

      - name: Verify Flyer Forge and retired flyer routes
        run: |
          sleep 15
          SMOKE_SKIP_UNIT_TESTS=1 ./scripts/smoke-test.sh https://bandtools-test.fly.dev

  wild-d-band-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_wild_d_experiment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r gig-flyers/requirements.txt

      - name: Run live H1/H2 experiment
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
        run: |
          cd gig-flyers
          python3 scripts/experiment_wild_d_band.py --live | tee /tmp/wild_d_experiment.log
          cat output/experiments/wild_d_band/results.json

      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wild-d-band-experiment
          path: |
            gig-flyers/output/experiments/wild_d_band/*.png
            gig-flyers/output/experiments/wild_d_band/results.json
