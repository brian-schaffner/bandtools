name: Extend Fly Volume

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Fly app name'
        required: true
        default: 'bandtools-test'
      new_size_gb:
        description: 'New volume size in GB'
        required: true
        default: '20'

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: List volumes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Current volumes for ${{ inputs.app_name }}:"
          flyctl volumes list -a ${{ inputs.app_name }}

      - name: Extend volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          VOLUME_ID=$(flyctl volumes list -a ${{ inputs.app_name }} --json | jq -r '.[0].id')
          echo "Extending volume $VOLUME_ID to ${{ inputs.new_size_gb }}GB..."
          flyctl volumes extend $VOLUME_ID -s ${{ inputs.new_size_gb }} -a ${{ inputs.app_name }}
          echo "Done! New volume list:"
          flyctl volumes list -a ${{ inputs.app_name }}
